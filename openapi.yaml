components:
  parameters:
    WsAccessTokenQuery:
      name: wsAccessToken
      in: query
      required: true
      description: A JWT token used to authorize the websocket connection
      schema:
        type: string
    RefreshTokenHeader:
      name: X-Refresh-Token
      in: header
      description: A JWT token used for refreshing the access token
      required: true
      schema:
        type: string
    UsernameQuery:
      name: username
      in: query
      required: true
      description: Username
      schema:
        type: string
    EmailQuery:
      name: email
      in: query
      required: true
      description: Email address
      schema:
        type: string
    AuthIdentityToken:
      name: Chtn-Auth-Identity-Token
      in: header
      description: A JWT token used for authentication
      required: true
      schema:
        type: string
    IdentityQuery:
      name: identity
      in: query
      required: true
      description: Username, e-mail address or phone number
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    RoomIdParam:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    InvitePartnerQuery:
      name: channelType
      in: query
      required: false
      schema:
        type: string
    InvitePartnerIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ContactIdParam:
      name: contactId
      in: path
      required: true
      schema:
        type: string
    SkipQuery:
      name: skip
      in: query
      required: true
      schema:
        type: integer
    MessageIdsQuery:
      name: messageIds
      description: Comma-separated list of messageIds
      in: query
      required: true
      schema:
        type: string
    MessageIdParam:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    TransferIdParam:
      name: transferId
      in: path
      required: true
      schema:
        type: string
    CascadeIdParam:
      name: cascadeId
      in: path
      required: true
      schema:
        type: string
    MemberIdParam:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    KickBanQuery:
      name: ban
      in: query
      required: false
      schema:
        type: boolean
    InviteIdParam:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
    ParentIdQuery:
      name: parentId
      in: query
      required: false
      schema:
        type: string
    ThreadIdParam:
      name: threadId
      in: path
      required: true
      schema:
        type: string
    RankIdParam:
      name: rankId
      in: path
      required: true
      schema:
        type: string
    CreatorIdParam:
      name: creatorId
      in: path
      required: true
      schema:
        type: string
    AlbumIdQuery:
      name: albumId
      in: query
      required: true
      schema:
        type: string
    PictureIdParam:
      name: pictureId
      in: path
      required: true
      schema:
        type: string
    CommentIdParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    AlbumIdParam:
      name: albumId
      in: path
      required: true
      schema:
        type: string
  schemas:
    SuccessfulAuthResp:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        userId:
          type: string
      required:
        - accessToken
        - refreshToken
        - userId
    AppleOAuthReq:
      type: object
      properties:
        code:
          type: string
          description: The authorization code that is returned from Apple's authentication flow
        os:
          type: string
          description: The Operating System of the device that is accessing Chatenium
        frontend:
          type: string
          description: The application's name that is accessing Chatenium
        isApple:
          type: boolean
          description: Whether the app is using Apple's native authentication flow (The app is Apple native) or the web flow (Web app or other non-native app)
      required:
        - code
        - os
        - frontend
        - isApple
    GoogleOAuthReq:
      type: object
      properties:
        code:
          type: string
          description: The authorization code that is returned from Apple's authentication flow
        os:
          type: string
          description: The Operating System of the device that is accessing Chatenium
        frontend:
          type: string
          description: The application's name that is accessing Chatenium
      required:
        - code
        - os
        - frontend
    DataAvailabilityResp:
      description: Used in e-mail/username availability checks
      type: object
      properties:
        used:
          type: boolean
      required:
        - used
    SignInReq:
      type: object
      properties:
        os:
          type: string
          description: The Operating System of the device that is accessing Chatenium
        frontend:
          type: string
          description: The application's name that is accessing Chatenium
      required:
        - os
        - frontend
    PasswordlessRegisterReq:
      type: object
      properties:
        username:
          type: string
          description: A username picked by the user
          x-oapi-codegen-extra-tags:
            validate: required,min=3,max=16,alphanum
        displayName:
          type: string
          description: A Display Name picked by the user
          x-oapi-codegen-extra-tags:
            validate: max=20
        os:
          type: string
          description: The Operating System of the device that is accessing Chatenium
        frontend:
          type: string
          description: The application's name that is accessing Chatenium
      required:
        - username
        - displayName
        - os
        - frontend
    RegisterReq:
      description: Used to register a new user
      type: object
      properties:
        username:
          type: string
          description: A username picked by the user
          x-oapi-codegen-extra-tags:
            validate: required,min=3,max=16,alphanum
        displayName:
          type: string
          description: A Display Name picked by the user
          x-oapi-codegen-extra-tags:
            validate: max=20
        password:
          type: string
          description: A password picked by the user
          x-oapi-codegen-extra-tags:
            validate: required,min=6
        os:
          type: string
          description: The Operating System of the device that is accessing Chatenium
        frontend:
          type: string
          description: The application's name that is accessing Chatenium
      required:
        - username
        - displayName
        - password
        - os
        - frontend
    PasswordResetReq:
      type: object
      properties:
        newPassword:
          type: string
          description: A new password that will be used for signing in
          x-oapi-codegen-extra-tags:
            validate: required,min=6
      required:
        - unameMailPhone
        - code
        - newPassword
    GenericSuccessBody:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ChallengeDataOverride:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
    RegisterAuthAttemptReq:
      type: object
      properties:
        userId:
          type: string
        actionName:
          type: string
        override:
          $ref: '#/components/schemas/ChallengeDataOverride'
      required:
        - actionName
    Factor:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: The status of the specific challenge method
          example: pending
          enum:
            - PENDING
            - SUCCESS
            - TIMEOUT
    Challenge:
      type: object
      required:
        - challengeId
        - minimumSteps
        - factorsTracker
      properties:
        authIdentityToken:
          type: string
        challengeId:
          type: string
          format: uuid
          example: 4a289b70-1653-488f-9a1b-3652c71aef42
        minimumSteps:
          type: integer
          description: Total number of challenge methods required to complete the challenge
          example: 2
        factorsTracker:
          type: object
          description: A map matching available authentication methods
          additionalProperties:
            $ref: '#/components/schemas/Factor'
          example:
            password:
              status: PENDING
            google:
              status: SUCCESS
            sms:
              status: TIMEOUT
    VerifyFactorReq:
      type: object
      properties:
        factorName:
          type: string
        credential:
          type: string
        challengeId:
          type: string
      required:
        - factorName
        - challengeKey
        - challengeId
    RequestFactorCredentialReq:
      type: object
      properties:
        factorName:
          type: string
        challengeId:
          type: string
      required:
        - factorName
        - challengeId
    GetIdFromIdentityResp:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    PublicUserData:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        pfp:
          type: string
      required:
        - userId
        - username
    GIF:
      type: object
      properties:
        gifId:
          type: string
        url:
          type: string
        path:
          type: string
      required:
        - gifId
        - url
        - path
    PersonalUserData:
      allOf:
        - $ref: '#/components/schemas/PublicUserData'
        - type: object
          properties:
            savedGifs:
              type: array
              items:
                $ref: '#/components/schemas/GIF'
            userId:
              type: string
            username:
              type: string
            displayName:
              type: string
            pfp:
              type: string
            pictureDiscovery:
              type: boolean
            passwordSet:
              type: boolean
            emailSet:
              type: boolean
            phoneSet:
              type: boolean
          required:
            - savedGifs
            - userId
            - username
            - displayName
            - pfp
            - pictureDiscovery
            - passwordSet
            - emailSet
            - phoneSet
    RegisterFcmTokenReq:
      type: object
      properties:
