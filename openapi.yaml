openapi: 3.0.0
info:
  title: Chatenium API
  version: 3.0.0
  description: OpenAPI specifications for Chatenium API
servers:
  - url: http://localhost:3000/v3
  - url: https://api.chatenium.hu/v3
paths:
  /ws:
    get:
      path: /websocket
      tags:
        - WebSocket
      summary: WebSocket upgrade
      operationId: websocket
      parameters:
        - $ref: '#/components/parameters/WsAccessTokenQuery'
      responses:
        '101':
          description: Upgrade successful
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/rotate:
    patch:
      tags:
        - Auth
      summary: Rotate token pair
      description: Called when the access token expires. Generates a new pair of tokens and returns them to the user.
      operationId: rotateTokenPair
      parameters:
        - $ref: '#/components/parameters/RefreshTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/oauth/apple:
    post:
      tags:
        - Auth
      description: Authenticate using Apple.
      summary: Apple OAuth
      operationId: oauthApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleOAuthReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/oauth/google:
    post:
      tags:
        - Auth
      description: Authenticate using Google.
      summary: Google OAuth
      operationId: oauthGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/usage/username:
    get:
      tags:
        - Auth
      description: Fetches whether the specified username is available or not.
      summary: Username Availability
      operationId: usernameUsage
      parameters:
        - $ref: '#/components/parameters/UsernameQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAvailabilityResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/usage/email:
    get:
      tags:
        - Auth
      description: Fetches whether the specified e-mail address is available or not.
      summary: Email Availability
      operationId: emailUsage
      parameters:
        - $ref: '#/components/parameters/EmailQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAvailabilityResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/signIn:
    post:
      tags:
        - Auth
      description: Signs in the user and returns an access/refresh token pair + the user's ID.
      summary: Sign In
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInReq'
      parameters:
        - $ref: '#/components/parameters/AuthIdentityToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/ple:
    post:
      tags:
        - Auth
      description: 'Passwordless Registration: Registers a new user without a password. The user will need to provide a temporary code on every authentication.'
      summary: Passwordless Registration
      operationId: passwordlessRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessRegisterReq'
      parameters:
        - $ref: '#/components/parameters/AuthIdentityToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/register:
    post:
      tags:
        - Auth
      description: Validates the provided user data, registers them in the database and signs the user in.
      summary: Register
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulAuthResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/passReset:
    post:
      tags:
        - Auth
      description: Verifies the provided token and updates the user's password. The user does not get signed in automatically.
      summary: Password Reset
      operationId: passwordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetReq'
      parameters:
        - $ref: '#/components/parameters/AuthIdentityToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/challenge:
    post:
      tags:
        - Auth
      description: Registers a new challenge challenge attempt.
      summary: Register Challenge
      operationId: registerChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAuthAttemptReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    patch:
      tags:
        - Auth
      description: With the submitted credential, an attempt will be made to verify one factor.
      summary: Credential Verification
      operationId: verifyFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyFactorReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/challenge/requestCredential:
    post:
      tags:
        - Auth
      description: Requests a credential for specific factors (SMS, E-Mail).
      summary: Request credential
      operationId: requestCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestFactorCredentialReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /auth/userIdFromIdentity:
    get:
      tags:
        - Auth
      description: Fetches the user's ID from the provided identity.
      summary: Fetch User ID
      operationId: getIdFromIdentity
      parameters:
        - $ref: '#/components/parameters/IdentityQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdFromIdentityResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/personalUserData:
    get:
      tags:
        - Account
      summary: Get user data (including extra data)
      operationId: getPersonalUserData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalUserData'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/push/registerFirebase:
    post:
      tags:
        - Account
      summary: Register FCM Token
      operationId: registerFcmToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFcmTokenReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/push/registerApple:
    post:
      tags:
        - Account
      summary: Register APNS Token
      operationId: registerApnsToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterApnsTokenReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/profile/username:
    patch:
      tags:
        - Account
      summary: Change Username
      operationId: changeUsername
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/profile/displayName:
    patch:
      tags:
        - Account
      summary: Change Display Name
      operationId: changeDisplayName
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDisplayNameReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account:
    delete:
      tags:
        - Account
      summary: Delete Account
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/security/email:
    patch:
      tags:
        - Account
      summary: Change Email
      operationId: changeEmail
      parameters:
        - $ref: '#/components/parameters/AuthIdentityToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/sessions:
    get:
      tags:
        - Account
      summary: Get Sessions
      operationId: getSessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionV3'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/session/{sessionId}:
    delete:
      tags:
        - Account
      summary: Logout Session
      operationId: logoutSession
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/gifs:
    patch:
      tags:
        - Account
      summary: Toggle GIF Save
      operationId: toggleGifSave
      parameters:
        - name: url
          in: query
          description: URL of the GIF (Can be inside/outside of Chatenium)
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleGifReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/security/phone:
    patch:
      tags:
        - Account
      summary: Change Phone Number
      operationId: changePhoneNumber
      parameters:
        - $ref: '#/components/parameters/AuthIdentityToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/pfp/upload/register:
    post:
      tags:
        - Account
      summary: Register PFP Upload
      operationId: registerPfpUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3PresignedFileReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3PresignedFileResponse'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /account/pfp:
    patch:
      tags:
        - Account
      summary: Complete PFP Upload
      operationId: completePfpUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePfpUploadReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /calls/{roomId}:
    get:
      tags:
        - Call
      summary: Get access
      description: Gathers TURN and STUN servers and a LiveKit token for a successful WebRTC connection
      operationId: getRtcAccess
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccessResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /calls/{roomId}/{userId}:
    post:
      tags:
        - Call
      summary: Invite partner
      description: '**You cannot invite network members, only chat partners!** Invites your chat partner to join the call. The user will be notified about the call by various PUSH notification systems.'
      operationId: invitePartner
      parameters:
        - $ref: '#/components/parameters/InvitePartnerQuery'
        - $ref: '#/components/parameters/RoomIdParam'
        - $ref: '#/components/parameters/InvitePartnerIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get contacts
      description: Fetches each contact that is associated with the user ordered by the last time a message was sent.
      operationId: getContacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    post:
      tags:
        - Contacts
      summary: Create new contact
      description: Sends a request to the specified partner who can either accept the request by sending you a message or ignore it.
      operationId: newContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContactReq'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /contacts/{contactId}:
    patch:
      tags:
        - Contacts
      summary: Mute contact
      description: When muted, you will not receive notifications from the contact.
      operationId: setContactMute
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMuteReq'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    delete:
      tags:
        - Contacts
      summary: Delete contact
      operationId: deleteContact
      description: Deletes the contact from your contacts list and removes all DMs with the contact.
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}:
    delete:
      tags:
        - Direct messaging
      summary: Delete message(s)
      description: Deletes the specified message(s)
      operationId: deleteMessage
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
        - $ref: '#/components/parameters/MessageIdsQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    get:
      tags:
        - Direct messaging
      summary: Get
      description: Fetches all messages inside the chat
      operationId: getMessages
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
        - $ref: '#/components/parameters/SkipQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    post:
      tags:
        - Direct messaging
      summary: Send message
      description: Sends a new message into the chat
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}/pin:
    get:
      tags:
        - Direct messaging
      summary: Pinned messages
      description: Gets all pinned messages inside the chat
      operationId: getPinnedMessages
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PinnedMessage'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    post:
      tags:
        - Direct messaging
      summary: Pin message
      description: Pins the specified message
      operationId: pinMessage
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinMessageReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}/pin/{messageId}:
    delete:
      tags:
        - Direct messaging
      summary: Unpin message
      description: Unpins the specified message
      operationId: unpinMessage
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
        - $ref: '#/components/parameters/MessageIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}/{messageId}:
    patch:
      tags:
        - Direct messaging
      summary: Edit message
      description: Edits the content of the specified message
      operationId: editMessage
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
        - $ref: '#/components/parameters/MessageIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBody'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
    get:
      tags:
        - Direct messaging
      summary: Get position
      description: Gets the position of a message which can be passed as query param in get to load that section of messages
      operationId: getMessagePosition
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
        - $ref: '#/components/parameters/MessageIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPositionResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}/upload/register:
    post:
      tags:
        - Direct messaging
      summary: Register attachment(s) upload
      description: Registers the upload(s) and returns necessary data to complete the actual upload
      operationId: registerAttachmentUploads
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/S3PresignedFileReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/S3PresignedMultiResp'
        '400':
          $ref: '#/components/responses/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorBody'
  /dms/{contactId}/upload/complete:
    post:
      tags:
        - Direct messaging
      summary: Complete attachment upload
      description: Marks the upload as completed. After that the fileId can be provided when sending a message.
      operationId: completeAttachmentUpload
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      requestBody:
        content:
